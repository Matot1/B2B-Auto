# Ветка lab. Секреты: LOGIN, PASSWORD, BAND_WEBHOOK (Masked).
# Скрипты в корне. Джоба сама выходит после последнего node.

stages:
  - test

variables:
  CI: "true"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

test:playwright:
  stage: test
  tags:
    - QA
  image: nexus.fstravel.com/proxy-docker-ms/playwright:v1.61.1-noble
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  before_script:
    - npm config set registry "https://nexus.fstravel.com/repository/proxy-npm/"
    - npm config set replace-registry-host always
    - npm ci --cache .npm --prefer-offline
  timeout: 30m
  script:
    - node b2bVietnamBron.js
    - node b2bEgyptBron.js
    - node b2bGDSBron.js
    - node b2bHotelBron.js
    - node b2bCharterBY.js
    - node b2bCharterAsia.js
    - node b2bConstruct.js
  rules:
    - if: $CI_COMMIT_BRANCH == "lab"
    - if: $CI_PIPELINE_SOURCE == "web"
