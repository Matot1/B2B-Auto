# Секреты: LOGIN, PASSWORD, BAND_WEBHOOK (Masked).
# Запуск: CI/CD → Pipelines → Run pipeline (web).

stages:
  - test

variables:
  CI: "true"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

test:playwright:
  stage: test
  tags:
    - QA
  image: nexus.fstravel.com/proxy-docker-ms/playwright:v1.61.1-noble
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  before_script:
    - npm config set registry "https://nexus.fstravel.com/repository/proxy-npm/"
    - npm config set replace-registry-host always
    - npm ci --cache .npm --prefer-offline
  timeout: 90m
  script:
    - npx playwright test --config=playwright.bron.config.js
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
